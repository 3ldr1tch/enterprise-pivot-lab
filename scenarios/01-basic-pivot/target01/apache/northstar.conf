<VirtualHost *:80>
    ServerName northstar.internal

    DocumentRoot /var/www/northstar

    <Directory /var/www/northstar>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/northstar/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    DirectoryIndex index.php

    ErrorLog ${APACHE_LOG_DIR}/northstar-error.log
    CustomLog ${APACHE_LOG_DIR}/northstar-access.log combined
</VirtualHost>
