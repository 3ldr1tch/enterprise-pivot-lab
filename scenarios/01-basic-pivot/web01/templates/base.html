<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}OpsCheck{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: monospace;
            background: #111;
            color: #ddd;
        }

        header {
            background: #181818;
            padding: 18px 30px;
            border-bottom: 1px solid #444;
        }

        header strong {
            color: #62d96b;
        }

        nav {
            margin-top: 8px;
        }

        nav a {
            color: #aaa;
            margin-right: 20px;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel {
            background: #181818;
            border: 1px solid #333;
            padding: 24px;
            margin-bottom: 20px;
        }

        input {
            width: 70%;
            padding: 10px;
            background: #090909;
            color: #eee;
            border: 1px solid #555;
        }

        button {
            padding: 10px 18px;
            background: #333;
            color: white;
            border: 1px solid #666;
        }

        pre {
            background: #090909;
            padding: 20px;
            overflow-x: auto;
        }

        .status {
            color: #62d96b;
        }
    </style>
</head>

<body>

<header>
    <strong>OpsCheck</strong> // Infrastructure Diagnostics

    <nav>
        <a href="/">Dashboard</a>
        <a href="/diagnostics">Diagnostics</a>
        <a href="/health">API Health</a>
    </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

</body>
</html>
